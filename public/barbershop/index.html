<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Design-uri barbershop · twopixeldev</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg: #0b0b0d; --fg: #eceef2; --muted: #8b909b; --c: #00F0FF; --m: #FF2A6D; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 system-ui, sans-serif; padding: clamp(24px, 6vw, 80px) 16px; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.1; margin-bottom: 12px; }
  p.lead { color: var(--muted); max-width: 60ch; margin-bottom: 40px; }
  ul { list-style: none; padding: 0; display: grid; gap: 14px; }
  a.card { display: grid; grid-template-columns: 70px 1fr auto; gap: 18px; align-items: center; padding: 22px; border: 1px solid #23252b; border-radius: 14px; color: inherit; text-decoration: none; transition: border-color .25s, transform .25s; }
  a.card:hover { border-color: var(--c); transform: translateY(-2px); }
  .n { font: 800 28px/1 system-ui; color: var(--c); }
  .t b { display: block; font-size: 18px; } .t span { color: var(--muted); font-size: 14px; }
  .go { color: var(--m); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .soon { opacity: .45; pointer-events: none; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--c); }
  @media (max-width: 520px) { a.card { grid-template-columns: 44px 1fr; } .go { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Design-uri pentru barbershop</h1>
  <p class="lead">Cinci direcții diferite, toate completate din același set de date al frizeriei: nume, logo, culori, servicii, prețuri, poze, program și contact. Datele afișate acum sunt de exemplu.</p>
  <ul id="list"></ul>
  <footer>Realizat de <a href="https://twopixeldev.com/">twopixeldev</a> · contact@twopixeldev.com</footer>
</main>
<script>
  var D = [
    ["Noir Atelier", "Editorial de lux, negru și auriu, meniu pe tot ecranul", true],
    ["Monolith", "Business, grilă elvețiană, meniu vertical pe stânga", true],
    ["Heritage Club", "Club clasic, verde și alamă, logo în mijlocul meniului", true],
    ["Neon Studio", "Inovator, secțiuni pe orizontală, meniu tip aplicație", true],
    ["Split", "Ecran împărțit, crem minimalist, meniu cu file", false]
  ];
  var q = new URLSearchParams(location.search).get("client");
  var suf = q && /^[a-z0-9-]{1,40}$/.test(q) ? "?client=" + q : "";
  document.getElementById("list").innerHTML = D.map(function (x, i) {
    return '<li><a class="card' + (x[2] ? "" : " soon") + '" href="design_' + (i + 1) + '/' + suf + '"><span class="n">0' + (i + 1) + '</span><span class="t"><b>' + x[0] + '</b><span>' + x[1] + (x[2] ? "" : " · în lucru") + '</span></span><span class="go">Deschide →</span></a></li>';
  }).join("");
</script>
</body>
</html>
