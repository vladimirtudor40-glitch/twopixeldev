    (function () {

      var k = document.createElement('link');
      k.rel = 'preload'; k.as = 'image'; k.href = 'img/' + l + '/hero.jpg';
      k.setAttribute('imagesrcset', 'img/' + l + '/hero-m.jpg 800w, img/' + l + '/hero.jpg 1600w');
      k.setAttribute('imagesizes', '100vw');
      k.setAttribute('fetchpriority', 'high');
      document.head.appendChild(k);
    })();
  </script>
