  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231C1C1E'/%3E%3Ccircle cx='13' cy='19' r='5' fill='none' stroke='%232BB673' stroke-width='2.4'/%3E%3Cpath d='M17 15l8-8m-3 3l3 3' fill='none' stroke='%232BB673' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      var m = /[?&]loc=(mare|munte|oras)/.exec(location.search), d = 'img/' + (m ? m[1] : 'oras') + '/hero';
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'image'; l.href = d + '.jpg';
      l.setAttribute('imagesrcset', d + '-s.jpg 800w, ' + d + '.jpg 1600w');
      l.setAttribute('imagesizes', '(max-width: 1023px) 100vw, 50vw');
      document.head.appendChild(l);
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">

  <a class="skip" id="skip" href="#main"></a>

  <div class="panel-wrap" id="panel" hidden></div>
