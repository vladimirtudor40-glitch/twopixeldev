<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Template Vibrant | twopixeldev</title>
  <meta name="description" content="Template demo pentru o cazare mică, realizat de twopixeldev.">
  <meta name="theme-color" content="#FFF8EC">
  <script>
    /* Pornește devreme descărcarea pozei principale, pentru locația cerută. */
    (function () {
      var p = new URLSearchParams(location.search);
      var loc = p.get('loc');
      if (['mare', 'munte', 'oras'].indexOf(loc) < 0) loc = 'mare';
      var l = document.createElement('link');
      var cale = 'img/' + loc + '/hero';
      l.rel = 'preload'; l.as = 'image'; l.href = cale + '.jpg';
      l.setAttribute('imagesrcset', cale + '-mic.jpg 720w, ' + cale + '.jpg 1200w');
      l.setAttribute('imagesizes', '(max-width: 820px) calc(100vw - 40px), 42vw');
      l.setAttribute('fetchpriority', 'high');
      document.head.appendChild(l);
      document.documentElement.className = 'js' + (p.get('embed') === '1' ? ' embed' : '');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FFC93C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <nav id="comutator" class="comutator" hidden></nav>
  <aside id="cookie" class="cookie" hidden></aside>
  <div id="cta-fix" class="cta-fix" hidden></div>

  <dialog id="lightbox" class="lightbox"></dialog>
  <dialog id="dialog" class="dialog"></dialog>

  <noscript>Această pagină demonstrativă are nevoie de JavaScript.</noscript>

  <script src="content.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
